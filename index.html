
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Happiness | Interactive World Map</title>

  <link rel="stylesheet" href="./style.css">

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script type="module" src="./js/main.js"></script>
</head>

<body>
  <main>
    <section class="scroll-scene" id="explore"
      aria-label="Explore world happiness">

      <div class="visual-stage">

        <!-- Initial heading, disappears on scroll -->
        <header class="page-header">
          <h1>Global Happiness</h1>
          <p>Explore happiness scores around the world.</p>
        </header>

        <!-- Same interactive map throughout scrolling -->
        <section class="map-panel"
          aria-label="Interactive happiness ranking map">

          <!-- Appears after scrolling -->
          <h2 class="map-title">
            Happiness Rankings by Country
          </h2>

          <div class="map-topbar">
            <span id="map-year">2025</span>

            <button
              id="reset-map"
              type="button"
              title="Clear country selections and map zoom">
              Reset Map
            </button>
          </div>

          <div id="map"></div>

          <div class="legend"
            aria-label="Happiness ranking color scale">
            <span>Lower happiness</span>
            <div class="legend-gradient"></div>
            <span>Higher happiness</span>
          </div>

          <p id="selection-info" aria-live="polite">
            Loading map...
          </p>
        </section>

        <!-- Line chart: still uses happiness scores -->
        <section class="chart-panel"
          aria-label="Happiness time series">

          <div class="chart-header">

            <div class="chart-heading">
              <h2>Happiness Score Over Time</h2>
              <p id="chart-subtitle">
                All countries (average)
              </p>
            </div>

            <div class="chart-buttons">

              <button
                id="playback-button"
                class="icon-button play-button"
                type="button"
                aria-label="Play animation"
                title="Play animation">
                <img
                  id="playback-icon"
                  src="./images/play.svg"
                  alt="">
              </button>

              <button
                id="reset-timeline"
                class="icon-button reset-button"
                type="button"
                aria-label="Reset animation only"
                title="Reset animation">
                <img
                  src="./images/reset.svg"
                  alt="">
              </button>

            </div>
          </div>

          <!-- Only appears after playback starts -->
          <div id="timeline" class="timeline" hidden>
            <input
              id="year-slider"
              type="range"
              min="2019"
              max="2025"
              step="1"
              value="2019"
              aria-label="Animation year">

            <output id="year-label" for="year-slider">
              2019
            </output>
          </div>

          <div class="chart-plot">
            <div id="line-chart"></div>

            <div
              id="chart-tooltip"
              class="chart-tooltip"
              hidden>
            </div>
          </div>

          <div
            id="chart-key"
            class="chart-key"
            aria-label="Chart legend">
          </div>

        </section>

        <p class="scroll-hint" aria-hidden="true">
          Scroll to explore trends over time
          <span>↓</span>
        </p>

      </div>
    </section>
  </main>
</body>
</html>
